<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arc Chat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg:         #ffffff;
    --bg-soft:    #f8f9fa;
    --border:     #e1e4e8;
    --text:       #1f2937;
    --text-dim:   #6b7280;
    --accent:     #3b82f6;
    --accent-dim: #60a5fa;
    --user-bg:    #eff6ff;
    --ai-bg:      #f9fafb;
  }

  [data-theme="dark"] {
    --bg:         #0f1419;
    --bg-soft:    #1a1f2e;
    --border:     #2d3748;
    --text:       #e4e7eb;
    --text-dim:   #9ca3af;
    --accent:     #60a5fa;
    --accent-dim: #93c5fd;
    --user-bg:    #1e3a5f;
    --ai-bg:      #1a1f2e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background .2s, color .2s;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 24px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  .logo {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 16px; color: white;
  }

  h1 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  .status {
    display: flex; align-items: center; gap: 8px;
    margin-left: auto;
    font-size: 13px; color: var(--text-dim);
  }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-dim);
    transition: background .3s;
  }
  .status-dot.ok  { background: #10b981; }
  .status-dot.err { background: #ef4444; }

  #theme-toggle {
    width: 36px; height: 36px;
    border: none; background: var(--bg-soft);
    border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  #theme-toggle:hover { background: var(--border); }
  #theme-toggle svg { width: 18px; height: 18px; fill: var(--text-dim); }

  #messages {
    flex: 1; overflow-y: auto;
    padding: 24px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  #messages::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

  .msg {
    display: flex; gap: 12px;
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user { justify-content: flex-end; }
  .msg.user .avatar { order: 2; }
  .msg.user .content { align-items: flex-end; }

  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 14px; font-weight: 500; color: var(--text-dim);
  }

  .content {
    display: flex; flex-direction: column; gap: 6px;
    max-width: 65%;
  }

  .bubble {
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
  }

  .msg.user .bubble {
    background: var(--user-bg);
    color: var(--text);
    border: 1px solid var(--accent-dim);
  }

  .msg.ai .bubble {
    background: var(--ai-bg);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .meta {
    font-size: 12px; color: var(--text-dim);
    padding: 0 4px;
  }

  .thinking .bubble {
    display: flex; gap: 6px; align-items: center; padding: 16px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity: .4; }
    30% { transform: translateY(-8px); opacity: 1; }
  }

  #empty {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; color: var(--text-dim);
  }
  #empty svg { width: 48px; height: 48px; opacity: .2; fill: var(--text-dim); }
  #empty p { font-size: 14px; }

  footer {
    padding: 16px 24px;
    background: var(--bg);
    border-top: 1px solid var(--border);
  }

  .input-container {
    display: flex; gap: 8px; align-items: flex-end;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 12px;
    transition: border-color .2s, box-shadow .2s;
  }
  .input-container:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
  }

  #input {
    flex: 1; background: transparent;
    border: none; outline: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px; resize: none;
    max-height: 120px; line-height: 1.5;
  }
  #input::placeholder { color: var(--text-dim); }

  #send-btn {
    background: var(--accent);
    border: none; border-radius: 8px;
    width: 36px; height: 36px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: opacity .2s, transform .1s;
  }
  #send-btn:hover { opacity: .9; }
  #send-btn:active { transform: scale(.95); }
  #send-btn:disabled { opacity: .4; cursor: not-allowed; }
  #send-btn svg { fill: white; width: 18px; height: 18px; }

  .footer-actions {
    display: flex; justify-content: space-between;
    align-items: center; margin-top: 12px;
  }

  .model-info { font-size: 12px; color: var(--text-dim); }

  #clear-btn {
    background: none; border: none;
    color: var(--text-dim); font-size: 13px;
    cursor: pointer; padding: 6px 12px;
    border-radius: 6px; transition: background .2s;
  }
  #clear-btn:hover { background: var(--bg-soft); }
</style>
</head>
<body>

<header>
  <div class="logo">A</div>
  <h1>Arc Chat</h1>
  <div class="status">
    <span id="status-text">bağlanıyor...</span>
    <div class="status-dot" id="status-dot"></div>
  </div>
  <button id="theme-toggle" aria-label="Tema değiştir">
    <svg id="sun-icon" viewBox="0 0 24 24" style="display:none">
      <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/>
      <line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <svg id="moon-icon" viewBox="0 0 24 24">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>
</header>

<div id="messages">
  <div id="empty">
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <p>Henüz mesaj yok</p>
  </div>
</div>

<footer>
  <div class="input-container">
    <textarea id="input" rows="1" placeholder="Mesaj yaz..."></textarea>
    <button id="send-btn">
      <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
  <div class="footer-actions">
    <span class="model-info" id="model-info">yükleniyor...</span>
    <button id="clear-btn">Temizle</button>
  </div>
</footer>

<script>
const API = 'http://localhost:7860/api';
const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('input');
const sendBtn    = document.getElementById('send-btn');
const emptyEl    = document.getElementById('empty');
const statusDot  = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const modelInfo  = document.getElementById('model-info');
const clearBtn   = document.getElementById('clear-btn');
const themeBtn   = document.getElementById('theme-toggle');
const sunIcon    = document.getElementById('sun-icon');
const moonIcon   = document.getElementById('moon-icon');

let history = [];
let busy    = false;

// ── Tema ──────────────────────────────────────────────────────────────────────
const theme = localStorage.getItem('theme') || 'light';
document.documentElement.dataset.theme = theme;
updateThemeIcon();

themeBtn.addEventListener('click', () => {
  const current = document.documentElement.dataset.theme;
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('theme', next);
  updateThemeIcon();
});

function updateThemeIcon() {
  const isDark = document.documentElement.dataset.theme === 'dark';
  sunIcon.style.display  = isDark ? 'block' : 'none';
  moonIcon.style.display = isDark ? 'none' : 'block';
}

// ── Sağlık ───────────────────────────────────────────────────────────────────
async function checkHealth() {
  try {
    const r = await fetch(`${API}/health`);
    const d = await r.json();
    if (d.backend === 'ok' && d.llama_server === 'ok') {
      statusDot.className = 'status-dot ok';
      statusText.textContent = 'bağlı';
      modelInfo.textContent = d.model;
    } else throw new Error();
  } catch {
    statusDot.className = 'status-dot err';
    statusText.textContent = 'bağlantı yok';
    modelInfo.textContent = 'sunucu çalışmıyor';
  }
}
checkHealth();
setInterval(checkHealth, 10000);

function addMessage(role, content, stats = null) {
  if (emptyEl) emptyEl.style.display = 'none';

  const msg = document.createElement('div');
  msg.className = `msg ${role === 'user' ? 'user' : 'ai'}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? 'S' : 'A';

  const contentDiv = document.createElement('div');
  contentDiv.className = 'content';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;

  contentDiv.appendChild(bubble);

  if (stats) {
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = stats;
    contentDiv.appendChild(meta);
  }

  msg.appendChild(avatar);
  msg.appendChild(contentDiv);
  messagesEl.appendChild(msg);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addThinking() {
  const msg = document.createElement('div');
  msg.className = 'msg ai thinking';
  msg.id = 'thinking';
  msg.innerHTML = `
    <div class="avatar">A</div>
    <div class="content">
      <div class="bubble">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>`;
  messagesEl.appendChild(msg);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeThinking() {
  document.getElementById('thinking')?.remove();
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;

  busy = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';

  history.push({ role: 'user', content: text });
  addMessage('user', text);
  addThinking();

  const t0 = performance.now();

  try {
    const res = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: history,
        max_tokens: 512,
        temperature: 0.7,
      }),
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const elapsed = ((performance.now() - t0) / 1000).toFixed(1);

    const reply = data.choices?.[0]?.message?.content ?? '(boş yanıt)';
    const usage = data.usage;
    let stats = null;
    if (usage) {
      const tps = usage.completion_tokens
        ? (usage.completion_tokens / parseFloat(elapsed)).toFixed(0)
        : '?';
      stats = `${usage.completion_tokens} token · ${tps} t/s · ${elapsed}s`;
    }

    history.push({ role: 'assistant', content: reply });
    removeThinking();
    addMessage('assistant', reply, stats);

  } catch (e) {
    removeThinking();
    addMessage('assistant', `Hata: ${e.message}`);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', send);

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

clearBtn.addEventListener('click', () => {
  history = [];
  messagesEl.innerHTML = '';
  messagesEl.appendChild(emptyEl);
  emptyEl.style.display = '';
});
</script>
</body>
</html>
