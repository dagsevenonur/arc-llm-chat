<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arc LLM Chat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  :root {
    --bg:        #0a0c10;
    --bg2:       #10141c;
    --bg3:       #161b26;
    --border:    #1e2535;
    --arc:       #00c8ff;
    --arc-dim:   #0077aa;
    --arc-glow:  rgba(0,200,255,0.12);
    --text:      #c8d8e8;
    --text-dim:  #556070;
    --user-bg:   #0d1929;
    --ai-bg:     #0a1018;
    --radius:    10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .logo {
    width: 32px; height: 32px;
    background: var(--arc);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex; align-items: center; justify-content: center;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 var(--arc-glow); }
    50%      { box-shadow: 0 0 16px 4px var(--arc-glow); }
  }

  .title-block h1 {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: .04em;
    color: var(--arc);
  }
  .title-block span {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
  }

  #status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #334;
    margin-left: auto;
    transition: background .3s, box-shadow .3s;
  }
  #status-dot.ok  { background: #00e676; box-shadow: 0 0 8px #00e676; }
  #status-dot.err { background: #ff5252; box-shadow: 0 0 8px #ff5252; }

  #status-text {
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-dim);
  }

  /* ── Messages ── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg-row {
    display: flex;
    padding: 4px 20px;
    animation: fadeUp .2s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user  { justify-content: flex-end; }
  .msg-row.ai    { justify-content: flex-start; }

  .bubble {
    max-width: min(72%, 640px);
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg-row.user .bubble {
    background: var(--user-bg);
    border: 1px solid var(--arc-dim);
    color: #ddeeff;
    border-bottom-right-radius: 3px;
  }

  .msg-row.ai .bubble {
    background: var(--ai-bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-bottom-left-radius: 3px;
  }

  .role-label {
    font-size: 10px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-dim);
    margin-bottom: 5px;
    letter-spacing: .06em;
    text-transform: uppercase;
  }

  .msg-col { display: flex; flex-direction: column; }
  .msg-row.user .msg-col { align-items: flex-end; }

  /* stats badge */
  .stats {
    font-size: 10px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--arc-dim);
    margin-top: 4px;
    padding: 2px 6px;
    background: rgba(0,200,255,.05);
    border-radius: 4px;
    width: fit-content;
  }

  /* thinking indicator */
  .thinking .bubble {
    display: flex; gap: 5px; align-items: center;
    padding: 14px 18px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--arc);
    animation: blink 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink {
    0%,80%,100% { opacity: .2; transform: scale(.8); }
    40%         { opacity: 1;  transform: scale(1.2); }
  }

  /* empty state */
  #empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-dim);
    pointer-events: none;
  }
  #empty .big { font-size: 48px; opacity: .15; }
  #empty p { font-size: 13px; font-family: 'IBM Plex Mono', monospace; }

  /* ── Input bar ── */
  footer {
    padding: 14px 20px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    transition: border-color .2s;
  }
  .input-row:focus-within { border-color: var(--arc-dim); }

  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    resize: none;
    max-height: 140px;
    line-height: 1.5;
  }
  #input::placeholder { color: var(--text-dim); }

  #send-btn {
    background: var(--arc);
    border: none;
    border-radius: 7px;
    width: 36px; height: 36px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: opacity .2s, transform .1s;
  }
  #send-btn:hover   { opacity: .85; }
  #send-btn:active  { transform: scale(.93); }
  #send-btn:disabled{ opacity: .3; cursor: default; }
  #send-btn svg { fill: #000; width: 16px; height: 16px; }

  .footer-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-dim);
  }

  #clear-btn {
    background: none; border: none;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    padding: 0;
  }
  #clear-btn:hover { color: var(--text); }
</style>
</head>
<body>

<header>
  <div class="logo"></div>
  <div class="title-block">
    <h1>Arc LLM Chat</h1>
    <span>Intel Arc B580 · SYCL · llama.cpp</span>
  </div>
  <span id="status-text">bağlanıyor...</span>
  <div id="status-dot"></div>
</header>

<div id="messages">
  <div id="empty">
    <div class="big">⬡</div>
    <p>// Arc LLM Chat hazır</p>
    <p>// GPU: Intel Arc B580 (12 GB)</p>
  </div>
</div>

<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="Mesaj yaz... (Enter göndер, Shift+Enter yeni satır)"></textarea>
    <button id="send-btn" title="Gönder">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="footer-meta">
    <span id="model-label">model yükleniyor...</span>
    <button id="clear-btn">sohbeti temizle</button>
  </div>
</footer>

<script>
const API = 'http://localhost:7860/api';
const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('input');
const sendBtn    = document.getElementById('send-btn');
const emptyEl    = document.getElementById('empty');
const statusDot  = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const modelLabel = document.getElementById('model-label');
const clearBtn   = document.getElementById('clear-btn');

let history = [];   // {role, content}[]
let busy    = false;

async function checkHealth() {
  try {
    const r = await fetch(`${API}/health`);
    const d = await r.json();
    if (d.backend === 'ok' && d.llama_server === 'ok') {
      statusDot.className = 'ok';
      statusText.textContent = 'bağlı';
      modelLabel.textContent = d.model + ' · ' + d.gpu;
    } else throw new Error();
  } catch {
    statusDot.className = 'err';
    statusText.textContent = 'bağlantı yok';
    modelLabel.textContent = 'sunucu çalışmıyor';
  }
}
checkHealth();
setInterval(checkHealth, 10000);

function addMessage(role, content, stats = null) {
  if (emptyEl) emptyEl.style.display = 'none';

  const row = document.createElement('div');
  row.className = `msg-row ${role === 'user' ? 'user' : 'ai'}`;

  const col = document.createElement('div');
  col.className = 'msg-col';

  const label = document.createElement('div');
  label.className = 'role-label';
  label.textContent = role === 'user' ? 'sen' : 'arc';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;

  col.appendChild(label);
  col.appendChild(bubble);

  if (stats) {
    const s = document.createElement('div');
    s.className = 'stats';
    s.textContent = stats;
    col.appendChild(s);
  }

  row.appendChild(col);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function addThinking() {
  const row = document.createElement('div');
  row.className = 'msg-row ai thinking';
  row.id = 'thinking';
  row.innerHTML = `
    <div class="msg-col">
      <div class="role-label">arc</div>
      <div class="bubble">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>`;
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeThinking() {
  document.getElementById('thinking')?.remove();
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;

  busy = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';

  history.push({ role: 'user', content: text });
  addMessage('user', text);
  addThinking();

  const t0 = performance.now();

  try {
    const res = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: history,
        max_tokens: 512,
        temperature: 0.7,
      }),
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const elapsed = ((performance.now() - t0) / 1000).toFixed(1);

    const reply = data.choices?.[0]?.message?.content ?? '(boş yanıt)';
    const usage = data.usage;
    let stats = null;
    if (usage) {
      const tps = usage.completion_tokens
        ? (usage.completion_tokens / parseFloat(elapsed)).toFixed(0)
        : '?';
      stats = `${usage.completion_tokens} token · ${tps} t/s · ${elapsed}s`;
    }

    history.push({ role: 'assistant', content: reply });
    removeThinking();
    addMessage('assistant', reply, stats);

  } catch (e) {
    removeThinking();
    addMessage('assistant', `Hata: ${e.message}`);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', send);

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
});

clearBtn.addEventListener('click', () => {
  history = [];
  messagesEl.innerHTML = '';
  messagesEl.appendChild(emptyEl);
  emptyEl.style.display = '';
});
</script>
</body>
</html>
